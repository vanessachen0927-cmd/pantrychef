services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pantrychef
      POSTGRES_PASSWORD: pantrychef
      POSTGRES_DB: pantrychef
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pantrychef"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+psycopg://pantrychef:pantrychef@db:5432/pantrychef
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  frontend:
    build:
      context: ./frontend
    env_file:
      - ./frontend/.env.local
    environment:
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      API_INTERNAL_URL: http://backend:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data: